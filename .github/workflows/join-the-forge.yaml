name: "Join the Forge"

# Invites are no longer automatic. A request issue only results in an
# invitation once an org owner applies the `invite-approved` label.

on:
  issues:
    types:
      - opened
      - labeled

jobs:
  acknowledge-request:
    if: >-
      github.event.action == 'opened' &&
      startsWith(github.event.issue.title, 'Please invite me to the Forge')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "Thanks for your interest in The-Node-Forge! Membership requests are reviewed manually, and you'll get an invitation here if your request is approved."

  invite-user:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'invite-approved' &&
      github.event.sender.login == 'Lanny-MacMillan' &&
      startsWith(github.event.issue.title, 'Please invite me to the Forge')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add user to the organization
        env:
          GH_TOKEN: ${{ secrets.ORG_INVITE_TOKEN }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          echo "Inviting $ISSUE_USER to The-Node-Forge..."
          gh api --method PUT "orgs/The-Node-Forge/memberships/$ISSUE_USER" -f role=member

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "Your request was approved! Check your email to accept the invitation to The-Node-Forge."
